<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>深淵符文:終焉高塔</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;}
body{background:#05070d;color:#e6ffe6;font-family:"Segoe UI","Noto Sans TC",sans-serif;overflow:hidden;}
.wrap{display:grid;grid-template-columns:280px 1fr 320px;height:100vh;}
.panel{padding:12px;overflow-y:auto;border-right:1px solid #133;}
h2,h3{margin:8px 0;}
.stat{margin:6px 0;font-size:15px;}
.btn{background:#2dff7a;border:none;padding:8px 14px;border-radius:14px;font-weight:bold;cursor:pointer;margin:4px;transition:.15s;}
.btn:hover{transform:scale(1.04);background:#8cffb3;color:#000;}
.btn:disabled{opacity:0.4;transform:none;cursor:not-allowed;background:#2dff7a;}
.card{width:130px;min-height:180px;background:#111827;border:2px solid #3bff95;border-radius:14px;padding:10px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;}
.card:hover{transform:translateY(-4px);background:#1a2436;}
.card.common{border-color:#9ca3af;}
.card.rare{border-color:#3b82f6;box-shadow:0 0 12px #2563eb66;}
.card.epic{border-color:#c026d3;box-shadow:0 0 12px #d946ef88;}
.card.legend{border-color:#facc15;box-shadow:0 0 16px #facc1588;}
.hand{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
.energy{position:absolute;top:6px;right:8px;background:#2dff7a;color:#000;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;}
.enemy{background:#220b0b;border:2px solid #ff5a5a;padding:16px;border-radius:16px;margin-top:14px;position:relative;}
.enemy.damage{animation:shake .25s;}
@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}100%{transform:translateX(0)}}
.node{padding:14px;border-radius:12px;background:#121827;border:1px solid #355;cursor:pointer;width:110px;text-align:center;transition:.15s;font-weight:bold;}
.node:hover{background:#1c2940;transform:scale(1.03);}
.node.done{opacity:.4;}
.map{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
.log{background:#03080f;border-radius:12px;padding:10px;height:90%;overflow-y:auto;font-size:13px;}
.log div{padding:5px 0;border-bottom:1px solid #122;}
.relic{padding:8px;margin:5px 0;background:#1d1730;border-radius:10px;border:1px solid #7550ff;font-size:13px;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:999;}
.modal-content{background:#111827;padding:20px;border-radius:20px;width:700px;max-width:95%;max-height:90vh;overflow:auto;border:2px solid #2dff7a;}
.shop-grid{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;}
.reward-grid{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#1f2937;margin-right:4px;font-size:12px;}
.small{font-size:12px;opacity:.82;}
.boss{color:#ffb347;}
.poison{color:#7cff7c;}
.vul{color:#ff9898;}
.hpbar{height:18px;background:#111;border-radius:999px;overflow:hidden;margin-top:6px;}
.hpfill{height:100%;background:linear-gradient(90deg,#ff4b4b,#ff9090);}
.playerhp{background:linear-gradient(90deg,#2dff7a,#85ffb0);}
.toprow{display:flex;gap:10px;flex-wrap:wrap;}
.result-card{width:110px;min-height:160px;background:#111827;border-radius:12px;padding:8px;margin:6px;text-align:center;position:relative;}
.result-card .energy{width:24px;height:24px;font-size:12px;top:4px;right:6px;}
.evolution-btn{background:#ffaa33;color:#000;font-weight:bold;border:1px solid #ffcc55;}
.evolution-btn:hover{background:#ffcc66;}
@keyframes cardPop{0%{opacity:0;transform:scale(0.5) rotate(-5deg);}60%{opacity:0.8;transform:scale(1.05) rotate(2deg);}100%{opacity:1;transform:scale(1) rotate(0);}}
.result-card{animation:cardPop 0.3s cubic-bezier(0.2,0.9,0.4,1.1) forwards;}
@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(1080deg);}}
.spin-animation{animation:spin 1.2s cubic-bezier(0.2,0.9,0.4,1.1) forwards;}
.wheel-result{font-size:28px;font-weight:bold;text-align:center;padding:30px;background:#0f1a12;border-radius:50%;width:250px;height:250px;display:flex;align-items:center;justify-content:center;margin:20px auto;border:3px solid #2dff7a;box-shadow:0 0 20px rgba(45,255,122,0.3);}
.wheel-button{background:#2dff7a;color:#000;font-weight:bold;padding:10px 24px;border-radius:40px;cursor:pointer;border:none;margin-top:20px;}
.wheel-button:hover{background:#8cffb3;}
.collection-card{width:110px;min-height:150px;background:#111827;border-radius:12px;padding:8px;margin:6px;text-align:center;position:relative;transition:0.1s;}
.collection-card.locked{opacity:0.5;filter:grayscale(0.5);}
.collection-card.locked::after{content:"🔒";position:absolute;top:5px;right:8px;font-size:18px;opacity:0.8;}
.collection-card .energy{width:24px;height:24px;font-size:12px;top:4px;right:6px;}
.collection-name{font-size:14px;font-weight:bold;margin-top:8px;}
.collection-rarity{font-size:11px;margin-top:4px;}
.collection-desc{font-size:10px;margin-top:6px;opacity:0.8;}
.collection-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px;max-height:70vh;overflow-y:auto;}
</style>
</head>
<body>

<div class="wrap">
<!-- LEFT -->
<div class="panel">
<h2>🧍 英雄</h2>
<div class="stat">❤️ HP：<span id="hp"></span>/<span id="maxHp"></span></div>
<div class="hpbar"><div id="playerHpFill" class="hpfill playerhp"></div></div>
<div class="stat">⚡ 能量：<span id="energy"></span>/<span id="maxEnergy"></span></div>
<div class="stat">🛡️ 護甲：<span id="block"></span></div>
<div class="stat">💰 魂石：<span id="gold"></span></div>
<div class="stat">🏔️ 樓層：<span id="floor"></span></div>
<div class="stat">☠️ 中毒：<span id="poison"></span></div>
<div class="stat">💪 力量：<span id="strength"></span></div>
<div class="stat">🌟 進化點數：<span id="evoPoints"></span></div>
<button id="evolveBtn" class="btn evolution-btn" onclick="evolveJob()">🌟 職業進化</button>
<div id="hiddenJobBtn" style="margin-top:8px;"></div>
<h3>🎭 職業</h3>
<div class="toprow">
<button class="btn" id="jobWarrior" onclick="setJob('warrior')">⚔️ 戰士</button>
<button class="btn" id="jobMage" onclick="setJob('mage')">🔮 法師</button>
<button class="btn" id="jobAssassin" onclick="setJob('assassin')">🗡️ 刺客</button>
</div>
<div id="jobInfo" class="small"></div>
<div id="evolvedInfo" class="small" style="color:#ffaa66;"></div>
<h3>📦 牌組</h3>
<div class="stat">抽牌堆：<span id="deckCount"></span></div>
<div class="stat">棄牌堆：<span id="discardCount"></span></div>
<div class="toprow">
<button class="btn" onclick="openDeckView()">查看牌組</button>
<button class="btn" onclick="openDrawModal()">✨ 抽卡</button>
<button class="btn" onclick="openBlackMarket()">💰 奸商</button>
<button class="btn" onclick="openWheelModal()">🎡 幸運轉盤</button>
</div>
<h3>🧿 遺物</h3>
<div id="relics"></div>
<div style="margin-top:12px">
<button class="btn" onclick="endTurn()">🔁 結束回合</button>
<button class="btn" onclick="saveGame()">💾 存檔</button>
<button class="btn" onclick="loadGame()">📀 讀檔</button>
</div>
</div>
<!-- CENTER -->
<div class="panel">
<h2>🗺️ 深淵地圖</h2>
<div id="map" class="map"></div>
<h2 style="margin-top:18px">👾 敵人</h2>
<div id="enemyArea"></div>
<h2 style="margin-top:18px">🎴 手牌</h2>
<div id="hand" class="hand"></div>
</div>
<!-- RIGHT -->
<div class="panel">
<h2>📜 冒險日誌</h2>
<div id="log" class="log"></div>
</div>
</div>

<!-- 模態框 -->
<div class="modal" id="shopModal"><div class="modal-content"><h2>🛒 商店</h2><div>魂石：<span id="shopGold"></span></div><div id="shopCards" class="shop-grid"></div><div style="margin-top:18px"><button class="btn" onclick="healShop()">❤️ 回復30HP（25）</button><button class="btn" onclick="removeCardShop()">🗑️ 刪除卡牌（35）</button><button class="btn" onclick="closeShop()">離開商店</button></div></div></div>
<div class="modal" id="blackMarketModal"><div class="modal-content"><h2>💰 奸商（三倍價格）</h2><p class="small">戰鬥中也可購買，立即加入牌組</p><div>魂石：<span id="blackGold"></span></div><div id="blackCards" class="shop-grid"></div><button class="btn" onclick="closeBlackMarket()">關閉</button></div></div>
<div class="modal" id="rewardModal"><div class="modal-content"><h2>🎁 選擇一張卡牌</h2><div id="rewardCards" class="reward-grid"></div></div></div>
<div class="modal" id="deckModal"><div class="modal-content"><h2>📚 牌組</h2><div id="deckView" class="reward-grid"></div><button class="btn" onclick="closeDeckView()">關閉</button></div></div>
<div class="modal" id="drawModal"><div class="modal-content"><h2>✨ 抽卡系統</h2><p>魂石：<span id="drawGold"></span></p><p class="small">抽卡會解鎖一張全新卡牌，解鎖後將出現在商店（與一般商品混合），可無限購買</p><div style="display:flex; gap:12px; margin:16px 0; align-items: center; justify-content: space-between;"><div><button class="btn" onclick="drawSingle()">單抽 100 石</button><button class="btn" onclick="drawTen()">十連抽 980 石</button></div><button class="btn" onclick="openCollectionModal()">📖 圖鑑</button></div><div id="drawResultArea" class="reward-grid" style="margin-top:12px;"></div><button class="btn" onclick="closeDrawModal()">關閉</button></div></div>
<div class="modal" id="collectionModal"><div class="modal-content"><h2>📖 卡牌圖鑑</h2><p class="small">抽卡池收集狀態（抽到後解鎖）</p><div id="collectionGrid" class="collection-grid"></div><button class="btn" onclick="closeCollectionModal()">關閉</button></div></div>
<div class="modal" id="wheelModal"><div class="modal-content"><h2>🎡 幸運轉盤</h2><p class="small">花費 60 魂石，隨機獲得一張一般卡或已解鎖卡（直接加入牌組）</p><div id="wheelSpinArea" style="text-align: center;"><div id="wheelResult" class="wheel-result">❓</div><button id="wheelStartBtn" class="wheel-button" onclick="startWheel()">開始旋轉</button></div><button class="btn" onclick="closeWheelModal()" style="margin-top:20px;">關閉</button></div></div>

<script>
// ================= 基礎卡池 =================
const baseCardPool = [
{name:"打擊",type:"atk",dmg:6,cost:1,rarity:"common",desc:"造成6傷害"},
{name:"防禦",type:"block",block:6,cost:1,rarity:"common",desc:"獲得6護甲"},
{name:"集中",type:"energy",gain:1,draw:1,cost:0,rarity:"rare",once:true,desc:"+1能量 抽1張"},
{name:"毒刃",type:"poison",dmg:5,poison:6,cost:1,rarity:"rare",desc:"造成5傷害並施加6中毒"}
];
const existingExtraCardPool = [
{name:"重擊",type:"atk",dmg:14,cost:2,rarity:"rare",desc:"造成14傷害"},
{name:"雙連擊",type:"multi",hits:2,dmg:5,cost:1,rarity:"rare",desc:"攻擊2次"},
{name:"鐵壁",type:"block",block:16,cost:2,rarity:"rare",desc:"獲得16護甲"},
{name:"破甲",type:"vul",vulnerable:2,cost:1,rarity:"epic",desc:"施加2層易傷"},
{name:"狂怒",type:"buff",strength:2,cost:1,rarity:"epic",desc:"獲得2力量"},
{name:"風暴斬",type:"multi",hits:4,dmg:4,cost:2,rarity:"epic",desc:"攻擊4次"},
{name:"終焉",type:"atk",dmg:36,cost:3,rarity:"legend",desc:"造成36傷害"}
];
const drawOnlyCardPool = [
{name:"連擊",type:"multi",hits:3,dmg:3,cost:1,rarity:"common",desc:"造成3傷害3次", price:45},
{name:"戰意",type:"buff",strength:2,cost:1,rarity:"common",desc:"獲得2力量", price:50},
{name:"毒爆",type:"poisonburst",cost:2,rarity:"rare",desc:"引爆所有中毒", price:55},
{name:"終焉斬",type:"atk",dmg:40,cost:4,rarity:"epic",desc:"造成40傷害", price:60},
{name:"時空扭曲",type:"energy",gain:3,draw:2,cost:0,rarity:"epic",desc:"+3能量並抽2張", price:80},
{name:"深淵降臨",type:"percentdmg",percent:0.5,cost:5,rarity:"legend",desc:"造成敵人50%最大生命傷害", price:95},
{name:"無限輪迴",type:"fullheal",cost:3,rarity:"legend",desc:"回滿生命並抽滿手牌", price:130},
{name:"治癒術",type:"heal",heal:8,cost:1,rarity:"common",desc:"恢復8生命", price:35},
{name:"盾擊",type:"atkblock",dmg:8,block:8,cost:1,rarity:"common",desc:"造成8傷害並獲得8護甲", price:40},
{name:"吸血斬",type:"lifesteal",dmg:12,heal:6,cost:2,rarity:"rare",desc:"造成12傷害並恢復6生命", price:60},
{name:"狂暴",type:"buff",strength:5,cost:2,rarity:"epic",desc:"獲得5力量", price:70},
{name:"風暴連斬",type:"multi",hits:6,dmg:4,cost:3,rarity:"epic",desc:"攻擊6次", price:80},
{name:"神之怒",type:"atk",dmg:100,cost:6,rarity:"legend",desc:"造成100傷害", price:85},
{name:"滅世風暴",type:"multi",hits:10,dmg:8,cost:5,rarity:"legend",desc:"攻擊10次", price:120}
];
const hiddenCardPool = {
    paladin: [
        {name:"制裁",type:"atk",dmg:75,cost:3,rarity:"legend",desc:"造成75傷害並施加20易傷", vulnerable:20},
        {name:"聖光術",type:"heal",heal:60,cost:2,rarity:"legend",desc:"恢復60生命"}
    ],
    ranger: [
        {name:"連射",type:"multi",hits:2,dmg:35,cost:2,rarity:"legend",desc:"造成35傷害2次"},
        {name:"陷阱",type:"debuff",cost:3,rarity:"legend",desc:"敵人下回合攻擊 -50%", effect:()=>{ if(state.enemy) state.enemy.nextTurnAtkMod = 0.5; log("🗡️ 陷阱生效，下回合敵人攻擊減半"); }}
    ],
    vampire: [
        {name:"緋紅之噬",type:"lifesteal",dmg:80,heal:30,cost:3,rarity:"legend",desc:"造成80傷害並恢復30生命"},
        {name:"紅蓮解體",type:"atk",dmg:300,cost:9,rarity:"legend",desc:"造成300傷害"}
    ]
};
const relicPool = [
{name:"尖刺護甲",desc:"被攻擊時反傷20%",rarity:"common",weight:8, effect(type,dmg){if(type==="hit"&&state.enemy){let thorns=Math.max(1,Math.floor(dmg*0.2));state.enemy.hp-=thorns;log(`🩸 尖刺護甲反傷 ${thorns}`);}}},
{name:"遠古卷軸",desc:"每回合額外抽1張牌",rarity:"common",weight:8, turnStart(){draw(1);}},
{name:"力量護符",desc:"永久獲得2力量",rarity:"common",weight:8, onGet(){state.strength+=2;log("💪 力量護符 +2 力量");}},
{name:"生命水晶",desc:"最大生命+10",rarity:"common",weight:8, onGet(){state.maxHp+=10;state.hp+=10;log("❤️ 最大生命 +10");}},
{name:"魔力核心",desc:"最大能量 +1",rarity:"rare",weight:3, onGet(){state.maxEnergy++; log("✨ 最大能量 +1");}, battleStart(){}},
{name:"鮮血戒指",desc:"攻擊後恢復10生命",rarity:"rare",weight:3, effect(type){if(type==="attack"){heal(10);}}},
{name:"毒蛇雕像",desc:"每回合開始時對敵人施加30中毒",rarity:"rare",weight:3, turnStart(){if(state.enemy){state.enemy.poison+=3;log("🐍 毒蛇雕像施加30中毒");}}},
{name:"幸運幣",desc:"商店價格降低10%",rarity:"rare",weight:3, onGet(){state.shopDiscount=0.9;log("💰 商店價格 -10%");}},
{name:"龍心",desc:"最大生命+25",rarity:"epic",weight:1, onGet(){state.maxHp+=25;state.hp+=25;log("❤️ 龍心 +25 最大生命");}},
{name:"風暴披風",desc:"每回合開始時獲得10護甲",rarity:"epic",weight:1, turnStart(){state.block+=3;log("🌬️ 風暴披風 +10 護甲");}},
{name:"時間沙漏",desc:"每場戰鬥首回合 +2 能量",rarity:"epic",weight:1, battleStart(){state.firstTurnBonusEnergy = (state.firstTurnBonusEnergy || 0) + 2; log("⏳ 首回合額外 +2 能量");}}
];
let state = {
hp:80,maxHp:80,energy:3,maxEnergy:3,block:0,gold:60,floor:1,job:"warrior",
strength:0,poison:0,deck:[],hand:[],discard:[],enemy:null,map:[],relics:[],
inBattle:false,usedOnceCards:[],unlockedCardNames:[],shopDiscount:1,
evolutionPoints:0,evolved:false,permanentStrength:0,
gameStarted:false,
firstTurnBonusEnergy:0,
firstTurnOfBattle:true,
rangerFirstAttackFree: false,
vampireHealRatio: 0.4
};
function copyCardFromPool(pool,name){ let c=pool.find(x=>x.name===name); return JSON.parse(JSON.stringify(c)); }
function copyCard(card){ return JSON.parse(JSON.stringify(card)); }
function shuffle(arr){ let a=[...arr]; for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function log(text){ let div=document.createElement("div");div.innerHTML=text;document.getElementById("log").prepend(div);while(document.getElementById("log").children.length>80) document.getElementById("log").removeChild(document.getElementById("log").lastChild); }
function heal(v){ state.hp=Math.min(state.maxHp,state.hp+v); }
function getNormalCards(){ return [...baseCardPool, ...existingExtraCardPool]; }
function getUnlockedCardObjects(){ return state.unlockedCardNames.map(name=>{let card=drawOnlyCardPool.find(c=>c.name===name); if(card) return copyCard(card); return null;}).filter(c=>c!==null); }
function getInitialDeck(){
    let deck=[];
    for(let i=0;i<5;i++) deck.push(copyCardFromPool(baseCardPool,"打擊"));
    for(let i=0;i<5;i++) deck.push(copyCardFromPool(baseCardPool,"防禦"));
    if(state.job==="mage") deck.push(copyCardFromPool(baseCardPool,"集中"));
    if(state.job==="assassin") deck.push(copyCardFromPool(baseCardPool,"毒刃"));
    if(state.job === "paladin"){
        deck.push(copyCard(hiddenCardPool.paladin[0]));
        deck.push(copyCard(hiddenCardPool.paladin[1]));
    } else if(state.job === "ranger"){
        deck.push(copyCard(hiddenCardPool.ranger[0]));
        deck.push(copyCard(hiddenCardPool.ranger[1]));
    } else if(state.job === "vampire"){
        deck.push(copyCard(hiddenCardPool.vampire[0]));
        deck.push(copyCard(hiddenCardPool.vampire[1]));
    }
    return shuffle(deck);
}
function getBaseJobStats(){
    let baseHp=100, baseEnergy=4;
    if(state.job==="warrior"){ baseHp=120; baseEnergy=4; }
    else if(state.job==="mage"){ baseHp=100; baseEnergy=5; }
    else if(state.job==="assassin"){ baseHp=100; baseEnergy=4; }
    else if(state.job==="paladin"){ baseHp=150; baseEnergy=4; }
    else if(state.job==="ranger"){ baseHp=120; baseEnergy=4; }
    else if(state.job==="vampire"){ baseHp=130; baseEnergy=5; }
    return {baseHp, baseEnergy};
}
function applyEvolution(){
    let {baseHp, baseEnergy} = getBaseJobStats();
    if(state.evolved){
        if(state.job==="warrior"){ baseHp=350; baseEnergy=baseEnergy+3; }
        else if(state.job==="mage"){ baseHp=250; baseEnergy=8; }
        else if(state.job==="assassin"){ baseHp=300; baseEnergy=4; }
        else if(state.job==="paladin"){ baseHp+=100; }
        else if(state.job==="ranger"){ baseHp+=80; state.permanentStrength+=10; }
        else if(state.job==="vampire"){ baseHp+=100; state.permanentStrength+=15; }
    }
    return {baseHp, baseEnergy};
}
function setJob(job){
    if(state.gameStarted && !(job === "paladin" || job === "ranger" || job === "vampire")){
        log("❌ 遊戲已開始，無法更換職業！");
        return;
    }
    state.job=job;
    state.evolved=false;
    state.evolutionPoints=0;
    state.permanentStrength=0;
    state.strength = 0;
    let {baseHp, baseEnergy}=applyEvolution();
    state.maxHp=baseHp;
    state.maxEnergy=baseEnergy;
    state.hp=state.maxHp;
    state.energy=state.maxEnergy;
    state.block=0;
    state.poison=0;
    state.relics=[];
    state.unlockedCardNames=[];
    state.shopDiscount=1;
    state.deck=getInitialDeck();
    state.hand=[];
    state.discard=[];
    generateMap();
    render();
    log(`🎭 選擇職業：${job}`);
}
function unlockHiddenJob(jobType){
    if(state.floor < 50){
        log("❌ 需要達到 50 層才能解鎖隱藏職業");
        return;
    }
    if(state.evolutionPoints < 5){
        log("❌ 需要 5 個進化點數才能解鎖隱藏職業");
        return;
    }
    state.evolutionPoints -= 5;
    setJob(jobType);
    log(`🌟 解鎖隱藏職業：${jobType}，消耗 5 進化點數`);
    render();
}
function evolveJob(){
    if(state.evolved){ log("已經進化過了！"); return; }
    if(state.evolutionPoints<=0){ log("沒有進化點數，擊敗30層後的Boss可獲得"); return; }
    state.evolved=true;
    state.evolutionPoints--;
    if(state.job==="assassin"){
        state.permanentStrength = 20;
        state.strength += 20;
        log("🗡️ 刺客進化：永久力量 +20");
    }
    let {baseHp, baseEnergy}=applyEvolution();
    state.maxHp=baseHp;
    state.maxEnergy=baseEnergy;
    state.energy = state.maxEnergy;
    log(`🌟 職業進化！獲得強化效果！`);
    render();
}
function generateMap(){
    state.map=[
        {type:"戰鬥",done:false},{type:"戰鬥",done:false},{type:"精英",done:false},{type:"商店",done:false},
        {type:Math.random()<0.5?"休息":"寶箱",done:false},{type:Math.random()<0.5?"休息":"寶箱",done:false}
    ];
    if(state.floor%5===0){
        let idx=Math.floor(Math.random()*state.map.length);
        state.map[idx]={type:"Boss",done:false};
    }
    state.map=shuffle(state.map);
}
function enterNode(i){
    let node=state.map[i]; if(node.done) return;
    node.done=true;
    if(!state.gameStarted){
        state.gameStarted=true;
        render();
    }
    switch(node.type){
        case "戰鬥": spawnEnemy("normal"); break;
        case "精英": spawnEnemy("elite"); break;
        case "Boss": spawnEnemy("boss"); break;
        case "休息": heal(Math.floor(state.maxHp*.4)); log("🔥 休息恢復生命"); break;
        case "寶箱":
            let goldGain=40+Math.floor(Math.random()*50);
            state.gold+=goldGain;
            log(`💰 寶箱獲得 ${goldGain} 魂石`);
            if(Math.random()<0.25) gainRelic();
            break;
        case "商店": openShop(); break;
    }
    render();
}
function spawnEnemy(rank){
    state.inBattle=true;
    let hp=40+state.floor*8, atk=6+state.floor;
    if(rank==="elite"){ hp*=1.8; atk*=1.5; }
    if(rank==="boss"){ hp*=3; atk*=2.2; }
    state.enemy={name:rank==="boss"?"終焉魔王":rank==="elite"?"深淵精英":"深淵怪物",rank,hp:Math.floor(hp),maxHp:Math.floor(hp),atk:Math.floor(atk),poison:0,vulnerable:0,rage:false};
    state.hand=[]; state.discard=[]; state.deck=shuffle(state.deck); state.usedOnceCards=[];
    state.firstTurnOfBattle = true;
    state.firstTurnBonusEnergy = 0;
    state.energy = state.maxEnergy;
    for(let r of state.relics) if(r.battleStart) r.battleStart();
    if(state.firstTurnBonusEnergy > 0){
        state.energy += state.firstTurnBonusEnergy;
        log(`⏳ 首回合額外 +${state.firstTurnBonusEnergy} 能量`);
    }
    if(state.evolved && state.job==="mage"){ state.block+=30; log("🔮 法師進化：獲得30護盾"); }
    log(`⚔️ 遭遇 ${state.enemy.name}`);
    startTurn();
}
function draw(n){
    for(let i=0;i<n;i++){
        if(state.deck.length===0){
            if(state.discard.length===0) break;
            state.deck=shuffle(state.discard);
            state.discard=[];
            log("🔄 洗牌");
        }
        if(state.deck.length) state.hand.push(state.deck.shift());
    }
}
function startTurn(){
    if(!state.enemy) return;
    if(state.firstTurnOfBattle){
        state.firstTurnOfBattle = false;
    } else {
        state.energy = state.maxEnergy;
    }
    state.block = 0;
    if(state.job === "paladin"){
        state.block += 20;
        log("🛡️ 聖騎士被動：獲得20護甲");
    }
    if(state.job==="mage") draw(6); else draw(5);
    for(let r of state.relics) if(r.turnStart) r.turnStart();
    for(let r of state.relics) if(r.effect) r.effect();
    if(state.poison>0){ state.hp-=state.poison; log(`☠️ 中毒造成 ${state.poison}`); state.poison--; if(state.hp<=0){ die(); return; } }
    render();
}
function dealDamage(dmg){
    if(state.job==="assassin" && Math.random()<0.2){ dmg=Math.floor(dmg*1.5); log("🗡️ 暴擊！"); }
    if(state.enemy.vulnerable>0) dmg=Math.floor(dmg*1.5);
    state.enemy.hp-=dmg;
    log(`⚔️ 造成 ${dmg} 傷害`);
    for(let r of state.relics) if(r.effect) r.effect("attack");
    let enemyDiv=document.getElementById("enemyBox");
    if(enemyDiv){ enemyDiv.classList.add("damage"); setTimeout(()=>{ enemyDiv.classList.remove("damage"); },180); }
}
function playCard(i){
    if(!state.enemy) return;
    let card=state.hand[i]; if(!card) return;
    let energyCost = card.cost;
    if(state.job === "ranger" && card.type === "atk" && !state.rangerFirstAttackFree){
        energyCost = 0;
        state.rangerFirstAttackFree = true;
        log("🏹 遊俠被動：首次攻擊不消耗能量");
    }
    if(state.energy<energyCost){ log("⚡ 能量不足"); return; }
    if(card.once && state.usedOnceCards.includes(card.name)){ log("❌ 此卡本回合已使用"); return; }
    state.energy-=energyCost;
    state.hand.splice(i,1);
    if(card.once) state.usedOnceCards.push(card.name);
    switch(card.type){
        case "atk": dealDamage(card.dmg+state.strength); if(card.vulnerable) state.enemy.vulnerable+=card.vulnerable; break;
        case "block": state.block+=card.block; log(`🛡️ 獲得 ${card.block} 護甲`); break;
        case "poison": dealDamage(card.dmg); state.enemy.poison+=card.poison; log(`☠️ 敵人中毒 ${card.poison}`); break;
        case "multi": for(let x=0;x<card.hits;x++) dealDamage(card.dmg+state.strength); break;
        case "energy": state.energy+=card.gain; draw(card.draw); log(`⚡ +${card.gain} 能量`); break;
        case "vul": state.enemy.vulnerable+=card.vulnerable; log(`💥 敵人易傷 ${card.vulnerable}`); break;
        case "buff": state.strength+=card.strength; log(`💪 力量 +${card.strength}`); break;
        case "poisonburst": let dmg=(state.enemy.poison||0)*3; state.enemy.hp-=dmg; state.enemy.poison=0; log(`💣 毒爆造成 ${dmg} 傷害，中毒清除`); break;
        case "percentdmg": let percentDmg=Math.floor(state.enemy.maxHp*card.percent); state.enemy.hp-=percentDmg; log(`🌑 深淵降臨造成 ${percentDmg} 傷害`); break;
        case "fullheal": state.hp=state.maxHp; log(`❤️ 生命已回滿`); let targetHandSize=10; while(state.hand.length<targetHandSize && (state.deck.length>0||state.discard.length>0)) draw(1); log(`🃏 抽滿手牌`); break;
        case "lifesteal": dealDamage(card.dmg); heal(card.heal); log(`🩸 恢復 ${card.heal} HP`); break;
        case "heal": heal(card.heal); log(`❤️ 恢復 ${card.heal} HP`); break;
        case "atkblock": dealDamage(card.dmg); state.block+=card.block; log(`🛡️ 獲得 ${card.block} 護甲`); break;
        case "debuff": if(card.effect) card.effect(); break;
        default: log(`未知卡牌類型: ${card.type}`);
    }
    if(state.job === "vampire" && (card.type === "atk" || card.type === "multi") && card.type !== "lifesteal"){
        let totalDamage = 0;
        if(card.type === "atk") totalDamage = card.dmg + state.strength;
        if(card.type === "multi") totalDamage = (card.dmg + state.strength) * card.hits;
        let vampireHeal = Math.floor(totalDamage * state.vampireHealRatio);
        heal(vampireHeal);
        log(`🩸 吸血鬼被動：吸血 ${vampireHeal}`);
    }
    state.discard.push(card);
    if(state.enemy && state.enemy.hp<=0){ victory(); return; }
    render();
}
function endTurn(){
    if(!state.enemy) return;
    while(state.hand.length) state.discard.push(state.hand.pop());
    if(state.job === "ranger") state.rangerFirstAttackFree = false;
    enemyTurn();
}
function enemyTurn(){
    if(!state.enemy) return;
    if(state.enemy.poison>0){ state.enemy.hp-=state.enemy.poison; log(`☠️ 敵人中毒 ${state.enemy.poison}`); state.enemy.poison--; if(state.enemy.hp<=0){ victory(); return; } }
    if(state.enemy.rank==="boss" && state.enemy.hp<state.enemy.maxHp*0.5 && !state.enemy.rage){ state.enemy.rage=true; state.enemy.atk+=8; log("🔥 Boss 狂暴化！"); }
    let dmg = state.enemy.atk;
    if(state.enemy.nextTurnAtkMod){
        dmg = Math.floor(dmg * state.enemy.nextTurnAtkMod);
        delete state.enemy.nextTurnAtkMod;
        log("🌀 陷阱效果：敵人攻擊力減半");
    }
    if(state.enemy.vulnerable>0) state.enemy.vulnerable--;
    dmg=Math.max(0,dmg-state.block);
    state.hp-=dmg;
    log(`👾 敵人造成 ${dmg} 傷害`);
    for(let r of state.relics) if(r.effect) r.effect("hit",dmg);
    if(state.hp<=0){ die(); return; }
    startTurn();
}
function victory(){
    state.inBattle=false;
    let rewardGold=25+state.floor*5;
    if(state.enemy.rank==="elite") rewardGold*=2;
    if(state.enemy.rank==="boss") rewardGold*=4;
    state.gold+=rewardGold;
    log(`🏆 勝利！獲得 ${rewardGold} 魂石`);
    showCardReward();
    if(state.enemy.rank==="boss" && state.floor>=30){
        state.evolutionPoints++;
        log(`🌟 獲得進化點數！可用於職業進化（目前 ${state.evolutionPoints} 點）`);
    }
    state.enemy=null;
    state.floor++;
    generateMap();
    render();
}
function gainRelic(){
    let available=relicPool.filter(r=>!state.relics.some(ex=>ex.name===r.name));
    if(available.length===0) return;
    let totalWeight=available.reduce((sum,r)=>sum+(r.weight||1),0);
    let rand=Math.random()*totalWeight;
    let accum=0, selected=null;
    for(let r of available){
        accum+=(r.weight||1);
        if(rand<=accum){ selected=r; break; }
    }
    if(!selected) selected=available[0];
    let newRelic=selected;
    state.relics.push(newRelic);
    if(newRelic.onGet) newRelic.onGet();
    log(`🧿 獲得遺物：${newRelic.name}（${newRelic.rarity}）`);
    render();
}
function getCardTooltip(card){
    let lines=[`${card.name} (${rarityText(card.rarity)})`,`費用: ${card.cost}`];
    if(card.dmg) lines.push(`傷害: ${card.dmg}`);
    if(card.block) lines.push(`護甲: ${card.block}`);
    if(card.heal) lines.push(`治療: ${card.heal}`);
    if(card.hits) lines.push(`攻擊次數: ${card.hits}`);
    if(card.poison) lines.push(`中毒: ${card.poison}`);
    if(card.strength) lines.push(`力量: ${card.strength}`);
    if(card.gain) lines.push(`獲得能量: ${card.gain}`);
    if(card.draw) lines.push(`抽牌: ${card.draw}`);
    lines.push(card.desc);
    return lines.join("\n");
}
function showCardReward(){
    let modal=document.getElementById("rewardModal");

function cardHtml(card){

function rarityText(r){

    if(r==="legend") return "傳說";

}

    selected.forEach(card=>{
        let div=document.createElement("div");

    });

    document.getElementById("drawGold").innerText=state.gold;
    document.getElementById("drawResultArea").innerHTML="";
    document.getElementById("drawModal").style.display="flex";
}
function closeDrawModal(){ document.getElementById("drawModal").style.display="none"; }
function openCollectionModal(){
    let container = document.getElementById("collectionGrid");
    container.innerHTML = "";
    for(let card of drawOnlyCardPool){
        let isUnlocked = state.unlockedCardNames.includes(card.name);
        let div = document.createElement("div");
        div.className = `collection-card ${isUnlocked ? "" : "locked"} ${card.rarity}`;
        div.innerHTML = `<div class="energy">${card.cost}</div><div class="collection-name">${card.name}</div><div class="collection-rarity">${rarityText(card.rarity)}</div><div class="collection-desc">${isUnlocked ? card.desc : "尚未解鎖，請抽卡"}</div>`;
        container.appendChild(div);
    }
    document.getElementById("collectionModal").style.display="flex";
}
function closeCollectionModal(){ document.getElementById("collectionModal").style.display="none"; }
function openWheelModal(){
    if(state.gold < 60){ log("💰 魂石不足 60"); return; }
    document.getElementById("wheelModal").style.display="flex";
    document.getElementById("wheelResult").innerHTML = "❓";
    document.getElementById("wheelResult").style.animation = "";
}
function closeWheelModal(){ document.getElementById("wheelModal").style.display="none"; }
function startWheel(){
    let btn = document.getElementById("wheelStartBtn");
    let resultDiv = document.getElementById("wheelResult");
    if(btn.disabled) return;
    btn.disabled = true;
    if(state.gold < 60){ log("💰 魂石不足 60"); btn.disabled=false; closeWheelModal(); return; }
    state.gold -= 60;
    render();
    let pool = [...getNormalCards(), ...getUnlockedCardObjects()];
    if(pool.length === 0){ log("❌ 無可用卡片"); btn.disabled=false; closeWheelModal(); return; }
    let randomIndex = Math.floor(Math.random() * pool.length);
    let wonCard = copyCard(pool[randomIndex]);
    resultDiv.style.animation = "spin 1.2s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards";
    let spinInterval = setInterval(() => {
        let tempPool = [...getNormalCards(), ...getUnlockedCardObjects()];
        if(tempPool.length) {
            let tempCard = tempPool[Math.floor(Math.random() * tempPool.length)];
            resultDiv.innerHTML = tempCard.name.substring(0, 6);
        } else { resultDiv.innerHTML = "???"; }
    }, 80);
    setTimeout(() => {
        clearInterval(spinInterval);
        resultDiv.style.animation = "";
        resultDiv.innerHTML = wonCard.name;
        resultDiv.style.fontSize = "24px";
        state.deck.push(wonCard);
        log(`🎡 轉盤獲得：${wonCard.name}（${rarityText(wonCard.rarity)}），已加入牌組`);
        btn.disabled = false;
    }, 1200);
}
function render(){
    document.getElementById("hp").innerText=state.hp;
    document.getElementById("maxHp").innerText=state.maxHp;
    document.getElementById("energy").innerText=state.energy;
    document.getElementById("maxEnergy").innerText=state.maxEnergy;
    document.getElementById("block").innerText=state.block;
    document.getElementById("gold").innerText=state.gold;
    document.getElementById("floor").innerText=state.floor;
    document.getElementById("poison").innerText=state.poison;
    document.getElementById("strength").innerText=state.strength;
    document.getElementById("evoPoints").innerText=state.evolutionPoints;
    document.getElementById("deckCount").innerText=state.deck.length;
    document.getElementById("discardCount").innerText=state.discard.length;
    let jobDesc="";
    if(state.job==="warrior") jobDesc="戰士：+20最大生命";
    else if(state.job==="mage") jobDesc="法師：+1能量，每回合抽6張";
    else if(state.job==="assassin") jobDesc="刺客：20%暴擊";
    else if(state.job==="paladin") jobDesc="聖騎士：每回合+20護甲";
    else if(state.job==="ranger") jobDesc="遊俠：首次攻擊不耗能";
    else if(state.job==="vampire") jobDesc="吸血鬼：攻擊吸血40%";
    if(state.evolved) jobDesc+=" (🌟已進化)";
    document.getElementById("jobInfo").innerHTML=jobDesc;
    document.getElementById("evolvedInfo").innerHTML=state.evolved?"已獲得進化之力":"";
    document.getElementById("playerHpFill").style.width=(state.hp/state.maxHp*100)+"%";
    let handHtml="";
    state.hand.forEach((card,i)=>{
        handHtml+=`<div class="card ${card.rarity}" title="${getCardTooltip(card).replace(/"/g, '&quot;')}" onclick="playCard(${i})">${cardHtml(card)}</div>`;
    });
    document.getElementById("hand").innerHTML=handHtml||"沒有手牌";
    let mapHtml="";
    state.map.forEach((n,i)=>{
        mapHtml+=`<div class="node ${n.done?'done':''}" onclick="enterNode(${i})">${n.type}</div>`;
    });
    document.getElementById("map").innerHTML=mapHtml;
    if(state.enemy){
        document.getElementById("enemyArea").innerHTML=`<div class="enemy" id="enemyBox"><h2 class="${state.enemy.rank==='boss'?'boss':''}">${state.enemy.name}</h2><div>❤️ ${state.enemy.hp}/${state.enemy.maxHp}</div><div class="hpbar"><div class="hpfill" style="width:${state.enemy.hp/state.enemy.maxHp*100}%"></div></div><div style="margin-top:8px">⚔️ 攻擊：${state.enemy.atk}</div><div class="poison">☠️ 中毒：${state.enemy.poison}</div><div class="vul">💥 易傷：${state.enemy.vulnerable}</div></div>`;
    }else{
        document.getElementById("enemyArea").innerHTML="<div class='small'>目前沒有敵人</div>";
    }
    let relicHtml="";
    state.relics.forEach(r=>{ relicHtml+=`<div class="relic"><div><b>${r.name}</b></div><div class="small">${r.desc}</div></div>`; });
    document.getElementById("relics").innerHTML=relicHtml||"無";
    let started=state.gameStarted;
    document.getElementById("jobWarrior").disabled=started;
    document.getElementById("jobMage").disabled=started;
    document.getElementById("jobAssassin").disabled=started;
    let hiddenBtnDiv = document.getElementById("hiddenJobBtn");
    if(state.floor >= 50 && state.evolutionPoints >= 5 && !(state.job === "paladin" || state.job === "ranger" || state.job === "vampire")){
        hiddenBtnDiv.innerHTML = `<button class="btn evolution-btn" onclick="unlockHiddenJob('paladin')">⚔️ 解鎖聖騎士 (5點)</button><button class="btn evolution-btn" onclick="unlockHiddenJob('ranger')">🏹 解鎖遊俠 (5點)</button><button class="btn evolution-btn" onclick="unlockHiddenJob('vampire')">🦇 解鎖吸血鬼 (5點)</button>`;
    } else {
        hiddenBtnDiv.innerHTML = "";
    }
}
function saveGame(){
    localStorage.setItem("abyss_rune_hidden",JSON.stringify(state));
    log("💾 已存檔");
}
function loadGame(){
    let raw=localStorage.getItem("abyss_rune_hidden");
    if(!raw){ log("❌ 沒有存檔"); return; }
    state=JSON.parse(raw);
    state.relics=state.relics.map(saved=>{ let original=relicPool.find(r=>r.name===saved.name); return original||saved; });
    if(state.permanentStrength===undefined) state.permanentStrength=0;
    if(state.gameStarted===undefined) state.gameStarted=false;
    if(state.firstTurnBonusEnergy===undefined) state.firstTurnBonusEnergy=0;
    if(state.firstTurnOfBattle===undefined) state.firstTurnOfBattle=true;
    if(state.rangerFirstAttackFree===undefined) state.rangerFirstAttackFree=false;
    render();
    log("📀 讀取完成");
}
setJob("warrior");
render();
log("🌌 深淵符文啟動 ");
</script>
</body>
</html>
